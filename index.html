*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Roboto,sans-serif;line-height:1.45}

nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.card h2{font-size:1.15rem;margin:0 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mut{color:var(--mut)}.big{font-size:3rem;font-weight:800;line-height:1}.mid{font-size:1.9rem;font-weight:800;line-height:1.1}
.bar{height:14px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%}
.pill{display:inline-block;padding:2px 11px;border-radius:99px;font-size:.85rem;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.t1{background:#fde7e4;color:#a1281b;border-color:#f4b8b0}.t2{background:#e4f1ff;color:#17519c;border-color:#b3d3f5}.t3{background:#eee;color:#555}
.me{background:#fdeaf3;color:#a3195b}.bo{background:#e2f1ff;color:#0d4f8b}.mz{background:#fff2d9;color:#8a5a00}.wj{background:#ece6ff;color:#4a2c9b}.el{background:#e1f7ec;color:#136e43}
.pc{background:#e6efff;color:#1d4ba8}.lap{background:#e9f7e6;color:#2a7a1f}.hh{background:#ffe8e8;color:#a31818}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}.k{font-weight:700}
table{border-collapse:collapse;width:100%;font-size:1rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-weight:700;font-size:.9rem;position:sticky;top:0;background:var(--card);z-index:2;box-shadow:0 1px 0 var(--line)}
.scroll{max-height:calc(100vh - 230px);overflow:auto;padding:0}
.tt{margin:4px 0 12px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg);font-size:.88rem}
.tt .dau{font-size:.95rem;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tt table{font-size:.85rem}.tt td{padding:2px 6px;vertical-align:top;border:0}.tt td.ic{width:20px;text-align:center;font-weight:800}
.tt td.tg{white-space:nowrap;color:var(--mut);width:64px}.tt .ly{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tt .sk{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}.tt .sk.ct div{white-space:normal;overflow:visible;line-height:1.35;margin-bottom:2px}.tt .sk div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes nhay{50%{opacity:.3}}.dot.nh{animation:nhay 1.1s infinite}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:8px 0}
select,input,textarea,button.b{font:inherit;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx)}
button.b{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}button.b.g{background:transparent;color:var(--tx);border:1px solid var(--line)}
button.s{font:inherit;font-size:.85rem;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer}button.s:hover{background:var(--bg)}
textarea{width:100%;min-height:62vh;font:15px/1.6 Consolas,monospace}
.thumb{width:68px;height:68px;object-fit:cover;border-radius:10px;background:var(--line);flex:none;border:1px solid var(--line)}
.thumb.lg{width:96px;height:96px}
.chart{display:flex;align-items:flex-end;gap:5px;height:110px}.chart div{flex:1;border-radius:4px 4px 0 0;min-height:3px;position:relative}
.chart span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:.72rem;color:var(--mut)}.lab{display:flex;gap:5px;font-size:.75rem;color:var(--mut)}.lab div{flex:1;text-align:center}
.todo li{margin:7px 0;font-size:1.02rem}
.win{background:#fff0b8;color:#7a5b00}a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
.sp{display:flex;gap:14px;align-items:flex-start}.sp .nm{font-weight:700}
.gridk{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(620px,1fr))}
.mc{display:flex;gap:16px}.mc .clips{margin-top:10px;display:grid;gap:7px}
.cl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg);border-radius:10px;padding:7px 11px;font-size:.95rem}
.cl .fn{flex:1;min-width:220px;overflow-wrap:anywhere;font-size:.92rem}
.sec{font-size:1.25rem;font-weight:800;margin:26px 0 10px;display:flex;align-items:center;gap:12px}
/* 05/11/2026 tab Báo cáo 2 máy: ô khung giờ */
.gh{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:10px 0}
.gh .o{border:1px solid var(--line);border-radius:10px;padding:6px 3px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.gh .o b{font-size:.78rem;color:var(--mut)}.gh .o span{font-weight:800;font-size:.92rem;white-space:nowrap}.gh .o small{font-size:.68rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gh .o.ok{border-color:var(--ok)}.gh .o.ok span{color:var(--ok)}.gh .o.bad{border-color:var(--bad)}.gh .o.bad span{color:var(--bad)}.gh .o.warn{border-color:var(--warn)}.gh .o.warn span{color:var(--warn)}
.gh .o.ac{border-color:var(--ac);animation:nhay 1.6s infinite}.gh .o.tr{border-style:dashed;opacity:.8}.gh .o.ch{opacity:.4}.gh .o.on{outline:3px solid var(--ac);outline-offset:1px}

}

  else if(m.nghi)dau=`<span class="dot"></span><b>MÁY SOI NGHỈ GIỮA VÒNG</b> <span class="mut">· vòng sau ${m.nghi.den>now?'sau '+phut(m.nghi.den-now):'đang bắt đầu'}</span>`;
  else dau=`<span class="dot off"></span><b class="mut">MÁY SOI chưa xong vòng đầu từ lúc mở bảng</b>`;
  const ct=(m.ct||[]).map(e=>`<div title="${esc(e.chu)}"><span class="mut">${gio(e.t)}</span> ${esc(e.chu)}</div>`).join('');
  return `<div class="tt"><div class="dau">${dau}</div>${ct?`<div class="sk ct"><div class="mut" style="font-weight:600">Máy soi + Claude duyệt ảnh — từng bước (mới nhất trên cùng)</div>${ct}</div>`:''}</div>`}
