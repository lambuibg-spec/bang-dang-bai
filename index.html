     <select onchange="chedo('${k}',this.value)"><option value="thu" ${cd=='thu'?'selected':''}>Chế độ THỬ (chạy mọi cửa kiểm, KHÔNG bấm đăng)</option><option value="that" ${cd=='that'?'selected':''}>Chế độ THẬT (đăng thật)</option></select></div>
    <div class="row"><label><input type="checkbox" ${(r.tu_duyet_bia||{})[k]?'checked':''} onchange="tuduyet('${k}',this.checked)"> Tự duyệt khung bìa khi máy "khá chắc" (không cần đại ca bấm) — rủi ro bìa chưa đẹp</label></div>
    <div class="mut">Trạng thái: ${esc(t.ghi_chu||'—')} · đã soạn ${t.da_chuan_bi} · chưa sẵn sàng ${t.chua_chuan_bi} · bị chặn ${t.bi_chan}${t.slot_tiep?' · slot tiếp theo '+t.slot_tiep:''}</div>
    <div class="scroll" style="max-height:340px;margin-top:10px"><table><tr><th></th><th>Clip</th><th>Máy</th><th>Tầng</th><th>Tình trạng</th></tr>${hang}</table></div></div>`}).join('');
  const ev=r.su_kien.map(e=>`<tr><td class="mut">${new Date(e.t*1000).toLocaleTimeString('vi-VN')}</td><td>${e.kenh}</td><td class="${e.muc=='loi'?'bad':e.muc=='ok'?'ok':e.muc=='canh'?'warn':''}">${esc(e.msg)}</td></tr>`).join('');
  const vd=dtj.viec.slice(0,10).map(v=>`<tr><td>${v.kenh}</td><td>${v.loai} ${esc(JSON.stringify(v.tham_so))}</td><td>${v.trang_thai}</td><td class="mut" style="font-size:.85rem">${esc((v.ket_qua||'').slice(-90))}</td></tr>`).join('');
  return `<div class="grid g2">${ks}</div>
   <div class="grid g2" style="margin-top:20px"><div class="card scroll"><h2>Nhật ký bộ đăng</h2><table>${ev||'<tr><td class="mut">chưa có sự kiện</td></tr>'}</table></div>
   <div class="card scroll"><h2>Việc trên điện thoại</h2><table><tr><th>Kênh</th><th>Việc</th><th>Tình trạng</th><th>Kết quả</th></tr>${vd||'<tr><td colspan=4 class="mut">chưa có</td></tr>'}</table></div></div>`}
async function congtac(k,b){if(b&&!confirm('BẬT tự động đăng cho '+S.kenh[k].cfg.ten+'?'))return draw();await api('/api/cong_tac',{method:'POST',body:JSON.stringify({kenh:k,bat:b})});draw()}
async function chedo(k,v){if(v=='that'&&!confirm('Chế độ THẬT: khi công tắc BẬT, bộ đăng sẽ ĐĂNG THẬT lên kênh. Chắc chưa?'))return draw();await api('/api/cong_tac',{method:'POST',body:JSON.stringify({kenh:k,che_do:v})});draw()}
async function tuduyet(k,b){await api('/api/tu_duyet_bia',{method:'POST',body:JSON.stringify({kenh:k,bat:b})});draw()}

async function draw(ep){   // ep=1: vẽ bắt buộc (vừa chọn ngày) dù con trỏ đang ở ô ngày
  if(!S)return;if((tab=='luat'||tab=='dc'||tab=='dh')&&window._lr)return;let h='';
  try{h=tab=='tq'?tq():tab=='dc'?await dc():tab=='td'?await td():tab=='kh'?await kh():tab=='kc'?await kc():tab=='mau'?await mau():tab=='dh'?await dh():tab=='vv'?vv():tab=='luat'?await luat():await ds()}catch(e){h='Lỗi: '+e}
  const act=document.activeElement;if(!ep&&act&&(act.tagName=='TEXTAREA'||act.classList.contains('mt')||act.type=='date'))return;   // 13/11: đang mở ô chọn ngày thì không vẽ đè   // đang gõ mục tiêu thì không vẽ lại đè mất số
  if(tab=='luat'||tab=='dc'||tab=='dh')window._lr=1;if(h===window._lh&&$('#m').innerHTML)return;window._lh=h;$('#m').innerHTML=h}   // 05/11: HTML không đổi thì không vẽ lại (giữ ô đang mở, khỏi tải lại ảnh)
// 11/11/2026 đại ca "làm hết các tab" (giao diện điện thoại): bảng nào rộng hơn màn ⇒ gắn .tbl-the + nhãn cột lấy từ dòng tiêu đề.
//   Chạy lại mỗi khi nội dung trang đổi (MutationObserver), chỉ ở màn ≤ 720px; máy tính giữ bảng.
const DT_MQ=matchMedia('(max-width:720px)');
function theHoa(){
  if(!DT_MQ.matches)return;
  document.querySelectorAll('#m table:not(.dhds):not(.tbl-the)').forEach(t=>{
    if(t.closest('.tt,.chi-pc')||!t.rows.length)return;
    const cha=t.parentElement;if(!cha||t.offsetWidth<=cha.clientWidth+4)return;
    const R=[...t.rows],laDau=r=>r.cells.length&&[...r.cells].every(c=>c.tagName=='TH'),dau=R.find(laDau);if(!dau)return;
    const nhan=[];[...dau.cells].forEach(c=>{for(let i=0;i<c.colSpan;i++)nhan.push(c.textContent.trim())});
    R.forEach(r=>{if(laDau(r)){r.classList.add('tbl-dau');return}
      let i=0;[...r.cells].forEach(c=>{const l=nhan[i]||'';i+=c.colSpan;if(l&&c.colSpan==1&&r.cells.length>1){c.dataset.l=l;const w=document.createElement('div');w.className='gt';while(c.firstChild)w.appendChild(c.firstChild);c.appendChild(w)}
        if(!c.textContent.trim()&&!c.querySelector('img,button,input,select,a,video,canvas,svg'))c.classList.add('rong');
        else if(!c.dataset.l&&!c.textContent.trim()&&c.querySelector('img'))c.classList.add('anh')})});
    t.classList.add('tbl-the')})}
new MutationObserver(()=>{clearTimeout(window._thT);window._thT=setTimeout(theHoa,60)}).observe($('#m'),{childList:true,subtree:true});
DT_MQ.addEventListener&&DT_MQ.addEventListener('change',()=>{window._lh=null;draw()});
nav();poll();setInterval(poll,8000);
</script>
