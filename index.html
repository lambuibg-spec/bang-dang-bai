html{font-size:17px}

.scroll{max-height:calc(100vh - 230px);overflow:auto;padding:0}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:8px 0}
select,input,textarea,button.b{font:inherit;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx)}
button.b{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}button.b.g{background:transparent;color:var(--tx);border:1px solid var(--line)}
button.s{font:inherit;font-size:.85rem;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer}button.s:hover{background:var(--bg)}
textarea{width:100%;min-height:62vh;font:15px/1.6 Consolas,monospace}
.thumb{width:68px;height:68px;object-fit:cover;border-radius:10px;background:var(--line);flex:none;border:1px solid var(--line)}
.thumb.lg{width:96px;height:96px}
.chart{display:flex;align-items:flex-end;gap:5px;height:110px}.chart div{flex:1;border-radius:4px 4px 0 0;min-height:3px;position:relative}
.chart span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:.72rem;color:var(--mut)}.lab{display:flex;gap:5px;font-size:.75rem;color:var(--mut)}.lab div{flex:1;text-align:center}

.win{background:#fff0b8;color:#7a5b00}a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}

.cl .fn{flex:1;min-width:220px;overflow-wrap:anywhere;font-size:.92rem}
.sec{font-size:1.25rem;font-weight:800;margin:26px 0 10px;display:flex;align-items:center;gap:12px}

</style>

  if(!v.chrome)L.push(`<span class="bad">Chrome ${v.cfg.ten} đang TẮT</span> — mở lại bằng .bat của kênh`);
  if(!v.cau)L.push(`<span class="bad">Cầu proxy ${v.cfg.ten} không phản hồi</span>`);
  if(v.thieu>0&&!v.du_clip)L.push(`<span class="warn">${v.cfg.ten}: thiếu ${v.thieu} bài mới đạt mục tiêu nhưng kho chỉ có ${v.kho.cho_dang} clip sẵn đăng</span> → báo tab cắt ghép làm thêm`);
  if(v.kho.trung)L.push(`${v.cfg.ten}: ${v.kho.trung} clip nghi TRÙNG nằm trong thư mục — chờ đại ca quyết xoá / giữ`);
  if(v.kho.chua_xong)L.push(`${v.cfg.ten}: ${v.kho.chua_xong} clip còn "CHƯA XONG"`);
  if(v.cfg.ghi_chu_kho)L.push(`<span class="mut">${v.cfg.ghi_chu_kho}</span>`);
  return L;
}
